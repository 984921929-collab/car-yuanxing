<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>车商列表</title>
  <style>
    :root {
      --red: #ef3f4f;
      --red-soft: #fff0f2;
      --blue: #2878ff;
      --blue-soft: #eef5ff;
      --orange: #ff8a00;
      --orange-soft: #fff4e8;
      --ink: #252932;
      --muted: #7b818c;
      --line: #eceef2;
      --bg: #f6f7f9;
      --panel: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(239, 63, 79, .06), transparent 34%, rgba(40, 120, 255, .05)),
        #eef1f5;
      color: var(--ink);
      display: grid;
      place-items: start center;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .phone {
      width: min(100vw, 390px);
      min-height: 100vh;
      background: var(--bg);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 18px 48px rgba(30, 35, 45, .16);
    }

    .status {
      height: 26px;
      padding: 6px 14px 0;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .bars i {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: #111;
    }

    .bars i:nth-child(1) {
      height: 4px;
    }

    .bars i:nth-child(2) {
      height: 6px;
    }

    .bars i:nth-child(3) {
      height: 9px;
    }

    .bars i:nth-child(4) {
      height: 12px;
    }

    .wifi {
      width: 15px;
      height: 11px;
      position: relative;
      overflow: hidden;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      border: 2px solid #111;
      border-color: #111 transparent transparent transparent;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .wifi::before {
      width: 24px;
      height: 24px;
    }

    .wifi::after {
      width: 14px;
      height: 14px;
      bottom: -4px;
    }

    .wifi i {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #111;
      transform: translateX(-50%);
    }

    .battery {
      width: 22px;
      height: 11px;
      border: 1.5px solid #111;
      border-radius: 2px;
      position: relative;
      padding: 1px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #111;
    }

    .battery i {
      display: block;
      width: 78%;
      height: 100%;
      border-radius: 1px;
      background: #111;
    }

    .search-bar {
      height: 54px;
      background: var(--panel);
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 12px 8px;
      border-bottom: 1px solid var(--line);
    }

    .back {
      font-size: 28px;
      line-height: 1;
    }

    .search-box {
      min-width: 0;
      height: 38px;
      display: grid;
      grid-template-columns: 30px 1fr 26px;
      align-items: center;
      border: 1px solid #dfe3ea;
      border-radius: 22px;
      padding: 0 8px;
      background: #fff;
    }

    .magnifier {
      width: 17px;
      height: 17px;
      border: 2px solid #1e232b;
      border-radius: 50%;
      position: relative;
      justify-self: center;
    }

    .magnifier::after {
      content: "";
      position: absolute;
      right: -6px;
      bottom: -5px;
      width: 8px;
      height: 2px;
      border-radius: 2px;
      background: #1e232b;
      transform: rotate(45deg);
    }

    .search-box input {
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #c1c6cf;
    }

    .clear {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #a5abb5;
      background: #f0f2f5;
      box-shadow: inset 0 0 0 1px #e0e4ea;
      transition: transform .15s ease, color .15s ease, background .15s ease;
    }

    .clear:active {
      transform: scale(.92);
      color: #fff;
      background: var(--red);
      box-shadow: none;
    }

    .clear svg {
      width: 16px;
      height: 16px;
      display: block;
      fill: currentColor;
    }

    .search-btn {
      height: 38px;
      min-width: 62px;
      padding: 0 14px;
      border-radius: 22px;
      color: #fff;
      background: var(--red);
      font-weight: 700;
    }

    .filters {
      height: 44px;
      background: var(--panel);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 46px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .filter {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #4d535e;
      font-size: 14px;
      white-space: nowrap;
    }

    .filter::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 1.5px solid #5f6570;
      border-bottom: 1.5px solid #5f6570;
      transform: rotate(45deg) translateY(-2px);
    }

    .filter-icon {
      border-left: 1px solid var(--line);
      height: 26px;
      display: grid;
      place-items: center;
    }

    .filter-icon svg {
      width: 23px;
      height: 23px;
      stroke: #5d626d;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .list {
      height: calc(100vh - 26px - 54px - 44px);
      overflow: auto;
      padding: 14px 12px 84px;
    }

    .card {
      width: 100%;
      background: #fff;
      margin-bottom: 14px;
      padding: 15px 14px 14px;
      position: relative;
      border-radius: 2px;
      border: 1px solid #f0f1f4;
      text-align: left;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18px;
      width: 3px;
      height: 20px;
      background: var(--red);
      border-radius: 0 3px 3px 0;
    }

    .card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .name {
      margin: 0;
      font-size: 17px;
      line-height: 1.42;
      font-weight: 800;
      letter-spacing: 0;
      text-align: left;
    }

    .status-text {
      margin-top: 2px;
      color: #9a9fa8;
      font-size: 15px;
      white-space: nowrap;
    }

    .status-text.red {
      color: var(--red);
    }

    .status-text.orange {
      color: var(--orange);
    }

    .tags {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      min-height: 25px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .tag.red {
      color: #fff;
      background: var(--red);
      font-weight: 700;
    }

    .tag.blue {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .tag.pink {
      color: var(--red);
      background: #ffecef;
    }

    .tag.orange {
      color: var(--orange);
      background: var(--orange-soft);
    }

    .info {
      margin-top: 13px;
      display: grid;
      gap: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .info-row {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      gap: 8px;
    }

    .info-row.two {
      grid-template-columns: 70px 62px 76px minmax(0, 1fr);
      column-gap: 6px;
    }

    .label {
      color: #858b95;
      white-space: nowrap;
    }

    .value {
      color: #222731;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fab {
      position: absolute;
      right: 18px;
      bottom: 28px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 8px 18px rgba(239, 63, 79, .36);
      z-index: 4;
    }

    .fab::before,
    .fab::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 30px;
      height: 3px;
      border-radius: 3px;
      background: #fff;
      transform: translate(-50%, -50%);
    }

    .fab::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 100px;
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 20px;
      background: rgba(18, 22, 30, .86);
      color: #fff;
      font-size: 13px;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 720px) {
      body {
        padding: 20px;
      }

      .phone {
        min-height: 780px;
        height: calc(100vh - 40px);
        border-radius: 26px;
      }
    }
  /* codex viewport-fit fix */
    .phone {
      display: flex;
      flex-direction: column;
    }
    .status,
    .search-bar {
      flex: 0 0 auto;
    }
  
/* codex fixed phone viewport height */
    .phone {
      height: 100vh;
      max-height: 100vh;
    }
    @media (min-width: 720px) {
      .phone {
        height: calc(100vh - 40px);
        max-height: calc(100vh - 40px);
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="车商列表">
    <div class="status">
      <span>9:41</span>
      <div class="signal">
        <span>5G</span>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="wifi" aria-hidden="true"><i></i></span>
        <span class="battery" aria-hidden="true"><i></i></span>
      </div>
    </div>

    <header class="search-bar">
      <button class="back" id="backHome" type="button" aria-label="返回">‹</button>
      <div class="search-box">
        <span class="magnifier" aria-hidden="true"></span>
        <input id="keyword" placeholder="请输入车商名称/姓名" />
        <button class="clear" id="clearKeyword" type="button" aria-label="清空">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path>
          </svg>
        </button>
      </div>
      <button class="search-btn" id="searchBtn" type="button">搜索</button>
    </header>

    <nav class="filters" aria-label="列表筛选">
      <button class="filter" type="button" data-filter="channel">全部渠道</button>
      <button class="filter" type="button" data-filter="status">全部状态</button>
      <button class="filter" type="button" data-filter="rating">全部评级</button>
      <button class="filter-icon" type="button" aria-label="更多筛选">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16l-6.3 7.1v5.3l-3.4 1.8v-7.1L4 5z"></path>
        </svg>
      </button>
    </nav>

    <section class="list" id="list"></section>

    <button class="fab" id="createBtn" type="button" aria-label="新增二手个人车商"></button>
    <div class="toast" id="toast"></div>
  </main>

  <script>
    const dealers = [
      {
        type: "personal",
        name: "张三",
        phone: "13800138000",
        channel: "河南车乐租渠道商",
        city: "郑州、洛阳、广州",
        owner: "唐慧峰",
        rating: "核心车商",
        status: "审核通过",
        products: ["中重卡", "轻卡"],
        agent: "中介",
        cross: true
      },
      {
        type: "company",
        name: "南京鑫达商用车销售有限公司",
        phone: "15999999999",
        channel: "渠道商名称渠道商名称渠道商名称",
        city: "南京",
        level: "一级经销商",
        status: "审核通过",
        products: ["轻卡"],
        owner: "唐慧峰",
        tags: ["福田", "欧曼二级贴息", "新车"]
      },
      {
        type: "company",
        name: "江苏远诚汽车贸易有限公司",
        phone: "15888888888",
        channel: "渠道商名称渠道商名称渠道商名称",
        city: "南京",
        level: "二级经销商",
        status: "暂存",
        products: [],
        owner: "唐慧峰",
        tags: ["陕耀店", "新车"]
      },
      {
        type: "personal",
        name: "赵六",
        phone: "13600136000",
        channel: "河南车乐租渠道商",
        city: "郑州、深圳",
        owner: "唐慧峰",
        rating: "普通车商",
        status: "驳回",
        products: ["中重卡", "轻卡"],
        agent: "非中介",
        cross: true
      },
      {
        type: "company",
        name: "南京宏运商用车服务中心",
        phone: "15777777777",
        channel: "渠道商名称渠道商名称渠道商名称",
        city: "南京",
        level: "二级经销商",
        status: "审核中",
        products: [],
        owner: "唐慧峰",
        tags: ["改装厂", "新车"]
      }
    ];

    const list = document.querySelector("#list");
    const keyword = document.querySelector("#keyword");
    const toastNode = document.querySelector("#toast");

    function toast(message) {
      toastNode.textContent = message;
      toastNode.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => toastNode.classList.remove("show"), 1600);
    }

    function statusClass(status) {
      if (status === "驳回" || status === "暂存") return "red";
      if (status === "审核中") return "orange";
      return "";
    }

    function render(items = dealers) {
      list.innerHTML = "";
      items.forEach((dealer) => {
        const isPersonal = dealer.type === "personal";
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.innerHTML = `
          <div class="card-head">
            <h2 class="name">${dealer.name}</h2>
            <span class="status-text ${statusClass(dealer.status)}">${dealer.status}</span>
          </div>
          <div class="tags">
            ${isPersonal ? '<span class="tag red">二手个人</span>' : `<span class="tag blue">${dealer.level}</span>`}
            ${dealer.products.map((item) => `<span class="tag pink">${item}</span>`).join("")}
            ${isPersonal ? "" : dealer.tags.map((item) => `<span class="tag ${item === "新车" ? "orange" : "pink"}">${item}</span>`).join("")}
          </div>
          <div class="info">
            <div class="info-row"><span class="label">渠道商：</span><span class="value">${dealer.channel}</span></div>
            <div class="info-row two"><span class="label">负责人：</span><span class="value">${dealer.owner}</span><span class="label">${isPersonal ? "展业城市：" : "城市："}</span><span class="value">${isPersonal ? dealer.city : dealer.city}</span></div>
          </div>
        `;
        card.addEventListener("click", () => {
          if (isPersonal) {
            window.location.href = "detail.html";
            return;
          }
          toast("这里模拟原一级/二级车商详情");
        });
        list.appendChild(card);
      });
    }

    function search() {
      const value = keyword.value.trim();
      const result = dealers.filter((dealer) => {
        return !value || dealer.name.includes(value) || dealer.phone.includes(value) || dealer.channel.includes(value) || dealer.city.includes(value);
      });
      render(result);
      if (!result.length) toast("未找到匹配的车商");
    }

    document.querySelector("#searchBtn").addEventListener("click", search);
    keyword.addEventListener("keydown", (event) => {
      if (event.key === "Enter") search();
    });
    document.querySelector("#clearKeyword").addEventListener("click", () => {
      keyword.value = "";
      render();
    });
    document.querySelectorAll(".filter").forEach((button) => {
      button.addEventListener("click", () => toast("已模拟打开筛选：" + button.textContent));
    });
    document.querySelector(".filter-icon").addEventListener("click", () => toast("已模拟打开高级筛选"));
    document.querySelector("#backHome").addEventListener("click", () => {
      window.location.href = "home.html";
    });
    document.querySelector("#createBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    render();
  </script>
</body>
</html>
