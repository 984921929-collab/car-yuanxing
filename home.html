<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>首页</title>
  <style>
    :root {
      --red: #ef4b59;
      --ink: #1f2329;
      --muted: #8b9099;
      --bg: #f6f7f9;
      --panel: #fff;
      --line: #eef0f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef1f5;
      color: var(--ink);
      display: grid;
      place-items: start center;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .phone {
      width: min(100vw, 390px);
      min-height: 100vh;
      background: var(--bg);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 18px 48px rgba(30, 35, 45, .16);
    }

    .status {
      display: none;
      height: 26px;
      padding: 6px 16px 0;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      top: 0;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .bars i {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: #111;
    }

    .bars i:nth-child(1) { height: 4px; }
    .bars i:nth-child(2) { height: 6px; }
    .bars i:nth-child(3) { height: 9px; }
    .bars i:nth-child(4) { height: 12px; }

    .wifi {
      width: 15px;
      height: 11px;
      position: relative;
      overflow: hidden;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      border: 2px solid #111;
      border-color: #111 transparent transparent transparent;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .wifi::before {
      width: 24px;
      height: 24px;
    }

    .wifi::after {
      width: 14px;
      height: 14px;
      bottom: -4px;
    }

    .wifi i {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #111;
      transform: translateX(-50%);
    }

    .battery {
      width: 22px;
      height: 11px;
      border: 1.5px solid #111;
      border-radius: 2px;
      position: relative;
      padding: 1px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #111;
    }

    .battery i {
      display: block;
      width: 78%;
      height: 100%;
      border-radius: 1px;
      background: #111;
    }

    .content {
      height: calc(100vh - 64px);
      overflow: auto;
      padding-bottom: 22px;
    }

    .hero {
      min-height: 181px;
      aspect-ratio: 750 / 348;
      padding: 0;
      color: #fff;
      background: url("assets/home-hero-truck.svg") center top / cover no-repeat;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      display: none;
    }

    .hero::before {
      content: "";
      display: none;
    }

    .company {
      display: none;
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      position: relative;
      z-index: 2;
      text-shadow: 0 1px 8px rgba(156, 72, 61, .28);
    }

    .hello {
      display: none;
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 10px rgba(156, 72, 61, .3);
    }

    .menus {
      margin-top: -10px;
      padding: 13px 12px 10px;
      background: #fff;
      border-radius: 12px 12px 0 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 13px 4px;
      position: relative;
      z-index: 2;
    }

    .menu {
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 6px;
      font-size: 12px;
      white-space: nowrap;
    }

    .menu-icon {
      width: 44px;
      height: 44px;
      display: block;
      overflow: visible;
    }

    .menu-icon .icon-bg {
      fill: #fff1f3;
    }

    .menu-icon .icon-main {
      fill: #20242b;
    }

    .menu-icon .icon-white {
      fill: #fff;
    }

    .menu-icon .accent-fill {
      fill: var(--red);
    }

    .dot {
      width: 30px;
      height: 4px;
      margin: 10px auto 0;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--red) 0 70%, #ffd4d8 70%);
      grid-column: 1 / -1;
    }

    .message {
      margin: 12px 16px;
      padding: 13px 13px 14px;
      background: #fff;
    }

    .message-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .message h2 {
      margin: 0;
      font-size: 18px;
    }

    .message-head span {
      color: var(--red);
      font-size: 13px;
    }

    .msg {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .msg:first-of-type {
      border-top: 0;
    }

    .msg strong {
      display: block;
      margin-bottom: 4px;
    }

    .msg p {
      margin: 0;
      color: #9ca1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .overdue-panel {
      margin: 12px 16px;
      padding: 10px 12px;
      background: #fff;
      border-radius: 8px;
    }

    .overdue-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .overdue-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .overdue-head p {
      margin: 2px 0 0;
      color: #8b9099;
      font-size: 11px;
      font-weight: 700;
    }

    .overdue-head span {
      flex: 0 0 auto;
      height: 22px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      border-radius: 12px;
      color: var(--red);
      background: #fff0f2;
      font-size: 12px;
      font-weight: 900;
    }

    .overdue-list {
      display: grid;
      gap: 5px;
    }

    .overdue-item {
      width: 100%;
      padding: 7px 8px;
      border-radius: 6px;
      background: #fafbfc;
      display: grid;
      gap: 4px;
      text-align: left;
    }

    .overdue-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .overdue-name {
      font-size: 15px;
      font-weight: 900;
    }

    .overdue-status {
      flex: 0 0 auto;
      height: 21px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      border-radius: 11px;
      color: var(--red);
      background: #fff0f2;
      font-size: 11px;
      font-weight: 900;
    }

    .overdue-meta {
      display: block;
      color: #626a76;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 800;
    }

    .overdue-meta b,
    .overdue-meta strong {
      color: #20242b;
      font-weight: 900;
    }

    .overdue-note {
      display: none;
      padding-top: 0;
      border-top: 0;
      color: #9b640d;
      font-size: 12px;
      font-weight: 800;
    }

    .workspace {
      margin: 0 0 16px;
      padding: 16px 16px 24px;
      background: linear-gradient(180deg, #fff4eb, #fffaf5);
      border-radius: 12px 12px 0 0;
    }

    .work-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 14px;
      font-size: 17px;
      font-weight: 800;
      text-align: center;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .work-title {
      margin: 12px 0 8px;
      font-weight: 800;
    }

    .work-card {
      min-height: 52px;
      padding: 8px;
      background: #fff;
      border-radius: 5px;
      color: #747a84;
      font-size: 13px;
    }

    .work-card b {
      display: block;
      margin-top: 3px;
      color: #111;
      font-size: 20px;
    }

    .bottom-nav {
      height: 64px;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      border-top: 1px solid var(--line);
    }

    .nav-item {
      display: grid;
      justify-items: center;
      gap: 4px;
      font-size: 12px;
      color: #222;
    }

    .nav-item.active {
      color: var(--red);
      font-weight: 700;
    }

    .nav-icon {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-width: 2.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .nav-icon .nav-accent {
      stroke: var(--red);
    }

    @media (min-width: 720px) {
      body {
        padding: 20px;
      }

      .phone {
        min-height: 780px;
        height: calc(100vh - 40px);
        border-radius: 26px;
      }
    }
  /* codex viewport-fit fix */
    .phone {
      display: flex;
      flex-direction: column;
    }
    .content {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
    }
    .bottom-nav {
      flex: 0 0 auto;
    }
  
/* codex fixed phone viewport height */
    .phone {
      height: 100vh;
      max-height: 100vh;
    }
    @media (min-width: 720px) {
      .phone {
        height: calc(100vh - 40px);
        max-height: calc(100vh - 40px);
      }
    }
  </style>
</head>
